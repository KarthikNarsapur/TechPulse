[project]
name = "techpulse-backend"
version = "0.1.0"
description = "TechPulse serverless cloud and DevOps release intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "mangum>=0.19,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "feedparser>=6.0,<7.0",
  "python-dateutil>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
